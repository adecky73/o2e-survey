<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Power & Oxygen Supply Survey</title>
<style>
/* Layout: field-clipboard app — sticky header, outline rail of numbered questions (as on the paper form), one question per screen */
:root{
  --bg:#eef2f3; --surface:#ffffff; --sunk:#f6f8f9; --ink:#14232b; --muted:#5a6a72; --line:#d3dcdf; --line-strong:#b4c2c7;
  --accent:#0b6b72; --accent-ink:#ffffff; --accent-soft:#dcefef;
  --elec:#a86400; --elec-soft:#fbefd9; --oxy:#1d64a8; --oxy-soft:#e1ecf8; --intr:#9c2f55; --intr-soft:#f6e3ea;
  --req:#c62828; --ok:#2e7d4f; --ok-soft:#e1f2e7; --warn:#9a5b00; --warn-soft:#fff2d6; --bad:#b3261e;
  --lane-me:#d48a00; --lane-eb:#f2c46b; --lane-mo:#1d64a8; --lane-ob:#8bb7e6;
  --f-display:"Segoe UI Semibold","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1619; --surface:#152024; --sunk:#111b1e; --ink:#e2ebed; --muted:#93a5ab; --line:#2a3a3f; --line-strong:#3c5157;
  --accent:#43b5bb; --accent-ink:#06191b; --accent-soft:#163538;
  --elec:#f0a53a; --elec-soft:#3a2a10; --oxy:#74aee8; --oxy-soft:#142a40; --intr:#e57fa3; --intr-soft:#3a1824;
  --req:#ff6b6b; --ok:#5cc489; --ok-soft:#14301f; --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#ff7a70;
  --lane-me:#f0a53a; --lane-eb:#8a6a2a; --lane-mo:#74aee8; --lane-ob:#3c5f86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1619; --surface:#152024; --sunk:#111b1e; --ink:#e2ebed; --muted:#93a5ab; --line:#2a3a3f; --line-strong:#3c5157;
  --accent:#43b5bb; --accent-ink:#06191b; --accent-soft:#163538;
  --elec:#f0a53a; --elec-soft:#3a2a10; --oxy:#74aee8; --oxy-soft:#142a40; --intr:#e57fa3; --intr-soft:#3a1824;
  --req:#ff6b6b; --ok:#5cc489; --ok-soft:#14301f; --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#ff7a70;
  --lane-me:#f0a53a; --lane-eb:#8a6a2a; --lane-mo:#74aee8; --lane-ob:#3c5f86; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand h1{font-size:1.15rem;letter-spacing:.01em;white-space:nowrap}
.brand .fac{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.top .sp{flex:1}
.save{font-size:.8rem;color:var(--muted)}
.only-xs{display:none}
@media (max-width:600px){.save{display:none}.top{flex-wrap:nowrap}.brand{flex:1}.brand h1{font-size:1rem;overflow:hidden;text-overflow:ellipsis}.brand .fac{max-width:none}.top .sp{display:none}.hide-narrow{display:none}.only-xs{display:inline}}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:.82rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* shell */
.shell{display:block;min-height:calc(100% - 60px)}
.rail{background:var(--sunk);padding:14px 10px 40px;overflow-y:auto;position:fixed;inset:0 auto 0 0;width:min(340px,88vw);height:100%;z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.25);visibility:hidden}
.rail.open{transform:none;visibility:visible}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
.pbar-wrap{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbar{flex:1;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .2s}
.pbar-pct{font-weight:600;font-size:.9rem;min-width:3.2em;text-align:right;color:var(--accent)}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 120px}
.wrap{max-width:760px;margin:0 auto}
@media (prefers-reduced-motion:reduce){ .rail{transition:none} }

/* outline */
.prog{padding:4px 8px 14px}
.prog .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.part{margin-top:10px}
.part-h{display:flex;align-items:baseline;gap:6px;padding:6px 8px;font-family:var(--f-display);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.05em}
.part-h .sk{margin-left:auto;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400;font-size:.75rem;color:var(--muted)}
.sec-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 8px 2px 34px}
.nav-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:.9rem;line-height:1.25}
.nav-i:hover{background:var(--surface)}
.nav-i.cur{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.qn{font-family:var(--f-mono);font-size:.75rem;min-width:24px;height:20px;padding:0 4px;border-radius:10px;display:inline-grid;place-items:center;border:1px solid var(--line-strong);color:var(--muted);flex:none}
.qn.req{border-color:var(--req);color:var(--req)}
.qn.blank{border-style:dashed}
.st{width:9px;height:9px;border-radius:50%;flex:none;margin-left:auto;border:1.5px solid var(--line-strong)}
.st.done{background:var(--ok);border-color:var(--ok)}
.st.partial{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);border-color:var(--warn)}
.st.na{background:var(--muted);border-color:var(--muted)}
.st.missing{border-color:var(--req)}
.p1 .part-h{color:var(--accent)} .p2 .part-h{color:var(--elec)} .p3 .part-h{color:var(--oxy)} .p4 .part-h{color:var(--intr)} .p5 .part-h{color:var(--elec)}

/* step */
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.75rem;letter-spacing:.03em;text-transform:none;font-weight:600}
.chip.p1{background:var(--accent-soft);color:var(--accent)} .chip.p2,.chip.p5{background:var(--elec-soft);color:var(--elec)} .chip.p3{background:var(--oxy-soft);color:var(--oxy)} .chip.p4{background:var(--intr-soft);color:var(--intr)} .chip.p0,.chip.p6{background:var(--accent-soft);color:var(--accent)}
.chip.req{background:transparent;border:1px solid var(--req);color:var(--req)}
.chip.dep{background:var(--sunk);border:1px dashed var(--line-strong);color:var(--muted)}
.step-h{display:flex;gap:14px;align-items:flex-start;margin:10px 0 6px}
.bignum{font-family:var(--f-mono);font-size:1.05rem;font-weight:500;min-width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);color:var(--muted);flex:none}
.bignum.req{border-color:var(--req);color:var(--req)}
.step-h h2{font-size:1.9rem;padding-top:4px}
.help{color:var(--muted);margin:4px 0 0;max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:18px;display:flex;flex-direction:column;gap:22px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.lbl{font-weight:600}
.fld .hint{font-size:.85rem;color:var(--muted);margin-top:-2px}
.opt-tag{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:6px}
.sub-h{font-family:var(--f-display);font-size:1.15rem;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:-8px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 10px;min-height:40px}
textarea{min-height:90px;resize:vertical}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.unit{display:flex;align-items:stretch}
.unit input{border-top-right-radius:0;border-bottom-right-radius:0}
.unit span{border:1px solid var(--line-strong);border-left:0;background:var(--sunk);border-radius:0 6px 6px 0;padding:0 10px;display:grid;place-items:center;font-size:.85rem;color:var(--muted);white-space:nowrap}
.unit.narrow{max-width:260px}
.money{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;max-width:360px}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--line-strong)}
.choice input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice .def{display:block;font-size:.84rem;color:var(--muted)}
.choice.excl{border-style:dashed}
.spec{margin:-2px 0 4px 38px}
.grp-l{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 0 2px}
.yn{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;width:max-content}
.yn label{padding:8px 22px;cursor:pointer;border-right:1px solid var(--line-strong);font-weight:600}
.yn label:last-child{border-right:0}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn label.on{background:var(--accent);color:var(--accent-ink)}
.yn label:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
.clear{font-size:.8rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.g{border-collapse:collapse;width:100%;font-size:.92rem}
table.g th,table.g td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.g thead th{background:var(--sunk);font-size:.78rem;font-weight:600;color:var(--muted);line-height:1.25;vertical-align:bottom}
table.g tbody th{font-weight:600;min-width:150px}
table.g tbody th .rs{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
table.g td input{min-width:84px;min-height:36px;padding:6px 8px}
table.g td.x{color:var(--muted);text-align:center}
table.g tr:last-child>*{border-bottom:0}
table.g tfoot td,table.g tfoot th{background:var(--sunk);font-weight:600;border-top:1px solid var(--line-strong)}
.computed{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.92rem}
.computed b{font-family:var(--f-mono);font-weight:500}
.derived{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:6px;background:var(--sunk)}
.derived .val{font-weight:700}
.info{font-size:.92rem;color:var(--ink);background:var(--sunk);border-radius:6px;padding:12px 14px;border:1px solid var(--line)}
.info table{border-collapse:collapse;width:100%;font-size:.85rem}
.info th,.info td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.info th{background:var(--surface)}
.info p{margin:.3em 0}
.warns{display:flex;flex-direction:column;gap:6px}
.warn{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:8px 12px;border-radius:4px;font-size:.92rem}
.note-ok{background:var(--ok-soft);border-left:3px solid var(--ok);padding:8px 12px;border-radius:4px;font-size:.92rem}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.foot .sp{flex:1}
.na-tog{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.na-box{border:1px dashed var(--line-strong);border-radius:6px;padding:12px;background:var(--sunk)}
.rep-actions{display:flex;gap:8px;margin-top:8px}

/* home */
.home{max-width:980px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:26px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:2.5rem;letter-spacing:-.005em}
.hero p{max-width:60ch}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.88rem;align-items:center}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.acard h3{font-size:1.25rem}
.acard .meta{font-size:.85rem;color:var(--muted)}
.acard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag-ex{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 6px;width:max-content}
.minibar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent)}
.home-acts{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
.confirm{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:8px 10px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}

/* diary */
.lanes-key{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem}
.lanes-key span{display:inline-flex;align-items:center;gap:6px}
.lanes-key i{width:18px;height:8px;border-radius:2px;display:inline-block}
.dstrip{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 8px;align-items:center;font-size:.78rem}
.dstrip .dl{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.dstrip svg{width:100%;height:auto;display:block}
.ev-list{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:.9rem}
.ev .sw{width:10px;height:28px;border-radius:2px}
.ev .t{font-family:var(--f-mono);font-size:.85rem}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.sumtbl td,.sumtbl th{white-space:nowrap}

/* review */
.rv-part{margin-top:22px}
.rv-q{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px}
.rv-q .ans{font-size:.9rem}
.rv-q .ans div{margin:1px 0}
.rv-q .ans .k{color:var(--muted)}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:var(--r);padding:18px;max-width:720px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:90vh}
.modal textarea{min-height:300px;font-family:var(--f-mono);font-size:.8rem}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:70;font-size:.9rem}

/* survey */
.welcome{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.welcome h2{font-size:2.3rem;margin-top:4px}
.lead{font-size:1.1rem;max-width:62ch;margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.facts div{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface)}
.facts span{color:var(--muted);font-size:.9rem}
.privacy ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.drafts{display:flex;flex-direction:column;gap:8px}
.draft{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.idbox{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;width:max-content;max-width:100%}
.idcode{font-size:1.6rem;font-weight:600;letter-spacing:.06em;color:var(--accent)}
a.btn{text-decoration:none;color:inherit}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<noscript><p style="padding:16px">This survey needs JavaScript. Please open it in a current browser (Chrome, Firefox, Edge, Safari).</p></noscript>
<script>
/* =====================================================================
   SETTINGS – fill in before sending the survey (see LIESMICH.txt)
   Then open this file, click "Connection test" at the bottom of the start page.
   ===================================================================== */
const CONFIG = {
  // Private GitHub repository that stores the encrypted answers
  GITHUB_OWNER:  "adecky73",            // GitHub user or organisation, e.g. "andreas-example"
  GITHUB_REPO:   "o2e-responses",            // private repository, e.g. "o2e-responses"

const APP_VERSION = "2.0";
const KEY = "o2e-survey-v2";
let storageOK = true;
let S = {list:{}, cur:null, view:"home", step:"about", railOpen:false, lastSaved:null, showSkipped:false, consent:false, submit:null, demo:false, test:false};
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) S.list = JSON.parse(raw) || {}; } catch(e){ storageOK = false; } }
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function saveNow(){ const c = cur(); if (c) c.updated = new Date().toISOString(); try { localStorage.setItem(KEY, JSON.stringify(S.list)); S.lastSaved = new Date(); storageOK = true; } catch(e){ storageOK = false; } const el = document.getElementById("saveState"); if (el) el.innerHTML = saveLabel(); }
const saveLabel = () => storageOK ? (S.lastSaved ? `Saved on this device ${S.lastSaved.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}` : "Answers are saved on this device") : `<span style="color:var(--bad)">This browser cannot save. Do not close the page before submitting.</span>`;
const cur = () => S.list[S.cur];
const A = () => cur().answers;
const ID_ALPHA = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
function makeCode(){
  const b = new Uint8Array(8);
  try { crypto.getRandomValues(b); } catch(e){ for (let i=0;i<8;i++) b[i]=Math.floor(Math.random()*256); }
  const ch = [...b].map(x => ID_ALPHA[x % ID_ALPHA.length]).join("");
  return ch.slice(0,4) + "-" + ch.slice(4);
}
function newAssessment(data){
  let code; do { code = makeCode(); } while (Object.values(S.list).some(x => x.code === code));
  const id = code;
  S.list[id] = Object.assign({id, code:"O2E-"+code, created:new Date().toISOString(), updated:new Date().toISOString(), answers:{}, na:{}, diary:{from:"",to:"",events:[]}, submissions:[], consent:new Date().toISOString()}, data||{});
  S.list[id].id = id; S.list[id].code = "O2E-"+code;
  return id;
}
const countryName = c => (COUNTRIES.find(x => x[0]===c) || [c, c])[1];
/* ---------- status ---------- */
const activeSteps = a => STEPS.filter(s => !s.when || s.when(a));
function flatFields(fields, a){ const out=[]; (fields||[]).forEach(f=>{ if (f.when && !f.when(a)) return; if (f.t==="row") flatFields(f.fields, a).forEach(x=>out.push(x)); else out.push(f); }); return out; }
function fieldAnswered(f, a){
  const v = a[f.id];
  switch(f.t){
    case "multi": case "deptpick": return Array.isArray(v) && v.length>0 || (f.t==="deptpick" && filled(a[f.id+"__free"]));
    case "grid": { if (!v) return false; for (const r in v) for (const c in v[r]) if (filled(v[r][c])) return true; return false; }
    case "repeat": return Array.isArray(v) && v.some(r => Object.values(r).some(filled));
    case "check": return !!v;
    case "money": return filled(v);
    case "derived": return f.fn(a).v != null;
    default: return filled(v);
  }
}
const inputTypes = new Set(["country","text","email","tel","date","time","number","textarea","single","multi","yn","grid","repeat","money","check","select","deptpick","derived"]);
function stepStatus(s, a){
  const c = cur();
  if (c.na && c.na[s.id]) return "na";
  if (s.custom==="diary"){ const d=c.diary; if(!d.from||!d.to) return d.events.length?"partial":"empty"; return "done"; }
  if (s.custom==="review") return "";
  const fs = flatFields(s.fields, a).filter(f => inputTypes.has(f.t));
  const reqF = fs.filter(f => !f.opt);
  const ansReq = reqF.filter(f => fieldAnswered(f, a)).length;
  const ansAll = fs.filter(f => fieldAnswered(f, a)).length;
  if (reqF.length===0) return ansAll ? "done" : "empty";
  if (ansReq===reqF.length) return "done";
  return ansAll ? "partial" : "empty";
}

  if (!window.crypto || !crypto.subtle) throw new Error("this browser cannot encrypt (Web Crypto missing); please use a current Chrome, Edge, Firefox or Safari");
  const keyB64 = pemBody(CONFIG.PUBLIC_KEY);
  if (!keyB64) throw new Error("the survey has no encryption key yet (PUBLIC_KEY in the settings)");
  const pub = await crypto.subtle.importKey("spki", unb64(keyB64), {name:"RSA-OAEP", hash:"SHA-256"}, false, ["encrypt"]);
  const aes = await crypto.subtle.generateKey({name:"AES-GCM", length:256}, true, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, aes, new TextEncoder().encode(JSON.stringify(obj)));
  const ek = await crypto.subtle.encrypt({name:"RSA-OAEP"}, pub, await crypto.subtle.exportKey("raw", aes));
  return {format:"o2e-encrypted", v:1, alg:"RSA-OAEP-SHA256+A256GCM", ek:b64(ek), iv:b64(iv), ct:b64(ct)};
}

/* ---------- storing in the private GitHub repository ---------- */
function ghToken(){ const t = String(CONFIG.GITHUB_TOKEN||"").trim(); return t.startsWith("enc:") ? atob(t.slice(4)).split("").reverse().join("") : t; }
function ghReady(){ return !!(CONFIG.GITHUB_OWNER && CONFIG.GITHUB_REPO && ghToken() && pemBody(CONFIG.PUBLIC_KEY)); }
async function ghPut(path, text, message){
  const url = `https://api.github.com/repos/${encodeURIComponent(CONFIG.GITHUB_OWNER)}/${encodeURIComponent(CONFIG.GITHUB_REPO)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
  let r;
  try {
    r = await fetch(url, {method:"PUT", headers:{Authorization:"Bearer " + ghToken(), Accept:"application/vnd.github+json", "Content-Type":"application/json"},
      body: JSON.stringify({message, content: btoa(text), branch: CONFIG.GITHUB_BRANCH || "main"})});
  } catch(e){ throw new Error("no connection to GitHub (offline or blocked network)"); }
  if (!r.ok) {
    let m = ""; try { m = (await r.json()).message || ""; } catch(e){}
    if (r.status === 401) throw new Error("GitHub rejected the access token (expired or revoked)");
    if (r.status === 403 || r.status === 404) throw new Error(`GitHub refused the upload (HTTP ${r.status}${m?": "+m:""}); check token permission “Contents: read and write” for this repository`);
    throw new Error(`GitHub answered HTTP ${r.status}${m?": "+m:""}`);
  }
}
function payloadFor(c, at, subNo){
  return {format:"o2e-response", version:3, app_version:APP_VERSION, id:c.code, submitted_at:at, submission_no:subNo,
          record: record(c, at, subNo), overview: flatten(c.answers), columns: columns().map(x => [x.key, x.label, x.q, x.type]), assessment: c};
}
async function submitSurvey(){
  const c = cur(); if (!c) return;
  const now = new Date(); const at = now.toISOString(); const subNo = (c.submissions||[]).filter(x=>x.ok).length + 1;
  const name = `${c.code}_${stamp(now)}.json`;
  S.submit = {state:"sending"}; rerenderKeepFocus();
  c.submissions = c.submissions || [];
  let fileText = "";
  try {
    const enc = await encryptPayload(payloadFor(c, at, subNo));
    fileText = JSON.stringify(Object.assign({id:c.code, submitted_at:at}, enc));
    if (!ghReady()) throw new Error("the survey is not connected to the storage yet");
    await ghPut(`${CONFIG.GITHUB_PATH || "responses"}/${c.code}/${stamp(now)}.json`, fileText, `Response ${c.code} (${subNo})`);
    c.submissions.push({at, ok:true}); S.submit = {state:"ok", at};
  } catch(e){
    c.submissions.push({at, ok:false, err:e.message});
    S.submit = {state:"fail", err:e.message, name, url: fileText ? URL.createObjectURL(new Blob([fileText], {type:"application/json"})) : ""};
  }
  saveNow(); rerenderKeepFocus();
  const card = document.getElementById("submitCard"); if (card) card.scrollIntoView({block:"center"});
}
